name: GabpaWang
options:
  bundleIdPrefix: com.gabpawang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
  KakaoOpenSDK:
    url: https://github.com/kakao/kakao-ios-sdk-rx
    from: "2.22.0"

targets:
  GabpaWang:
    type: application
    platform: iOS
    sources:
      - path: GabpaWang
        excludes:
          - "**/*.md"
    resources:
      - path: GabpaWang/Resources
    info:
      path: GabpaWang/Resources/Info.plist
      properties:
        CFBundleName: 갑빠왕
        CFBundleDisplayName: 갑빠왕
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - armv7
          - front-facing-camera
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 푸쉬업 자세를 자동으로 카운트하기 위해 전면 카메라를 사용합니다. 영상은 기기 외부로 절대 전송되지 않습니다.
        NSPhotoLibraryAddUsageDescription: 레벨업 공유 카드를 사진 보관함에 저장하기 위해 사용합니다.
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        # OAuth callback schemes — fill in real values before shipping.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.gabpawang.app.kakao
            CFBundleURLSchemes:
              - kakao73af7802f9ee24065925157c33d9e031
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.gabpawang.app.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.680384045148-vlc7ffln8lou838mh0ka4cd3ce2cgceh
        LSApplicationQueriesSchemes:
          - kakaokompassauth
          - kakaolink
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-Bold.otf
          - Pretendard-ExtraBold.otf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabpawang.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: KakaoOpenSDK
        product: KakaoSDKCommon
      - package: KakaoOpenSDK
        product: KakaoSDKAuth
      - package: KakaoOpenSDK
        product: KakaoSDKUser

  GabpaWangTests:
    type: bundle.unit-test
    platform: iOS
    sources: GabpaWangTests
    dependencies:
      - target: GabpaWang
