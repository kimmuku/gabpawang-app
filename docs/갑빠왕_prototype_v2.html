<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내일은 갑빠왕 — Interactive Prototype</title>
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

@font-face { font-family:'Pretendard JP'; font-weight:400; src:url('fonts/PretendardJP-Regular.woff2') format('woff2'); }
@font-face { font-family:'Pretendard JP'; font-weight:500; src:url('fonts/PretendardJP-Medium.woff2') format('woff2'); }
@font-face { font-family:'Pretendard JP'; font-weight:600; src:url('fonts/PretendardJP-SemiBold.woff2') format('woff2'); }
@font-face { font-family:'Pretendard JP'; font-weight:700; src:url('fonts/PretendardJP-Bold.woff2') format('woff2'); }

body {
  font-family: 'Pretendard JP', -apple-system, sans-serif;
  background: #080810;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Android phone shell */
.android-shell {
  width: 360px;
  height: 780px;
  border-radius: 36px;
  background: #111118;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 0 0 6px #1a1a24,
    0 0 0 7px rgba(255,255,255,0.04),
    0 30px 80px rgba(0,0,0,0.8),
    0 0 120px rgba(255,196,0,0.05);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

/* Android status bar notch (punch-hole) */
.android-notch {
  position: absolute;
  top: 14px; left: 50%; transform: translateX(-50%);
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #111118;
  z-index: 200;
  box-shadow: 0 0 0 1.5px rgba(255,255,255,0.05);
}

/* Screen viewport */
.screen-viewport {
  position: absolute;
  inset: 0;
  border-radius: 36px;
  overflow: hidden;
}

/* Android gesture bar */
.android-gesture-bar {
  position: absolute;
  bottom: 10px; left: 50%; transform: translateX(-50%);
  width: 110px; height: 4px; border-radius: 4px;
  background: rgba(255,255,255,0.18);
  z-index: 200; pointer-events: none;
}

/* Slide transition */
.screen-enter {
  animation: slideIn 0.28s cubic-bezier(0.4,0,0.2,1) forwards;
}
.screen-exit {
  animation: slideOut 0.28s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0.6; }
  to   { transform: translateX(0);    opacity: 1; }
}
@keyframes slideOut {
  from { transform: translateX(0);    opacity: 1; }
  to   { transform: translateX(-30%); opacity: 0; }
}
@keyframes slideInBack {
  from { transform: translateX(-100%); opacity: 0.6; }
  to   { transform: translateX(0);     opacity: 1; }
}

/* Level-up animations */
@keyframes floatUp {
  0%   { transform: translateY(0) scale(1);  opacity: 0.9; }
  100% { transform: translateY(-320px) scale(0); opacity: 0; }
}
@keyframes charPulse {
  0%,100% { box-shadow: 0 0 40px var(--gc,rgba(255,196,0,0.5)), 0 0 80px var(--gc,rgba(255,196,0,0.2)); }
  50%      { box-shadow: 0 0 60px var(--gc,rgba(255,196,0,0.7)), 0 0 120px var(--gc,rgba(255,196,0,0.3)); }
}
@keyframes charFloat {
  0%,100% { transform: translateY(0px); }
  50%     { transform: translateY(-8px); }
}
@keyframes splashPop {
  from { transform: scale(0.7); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

/* Info panel next to phone */
.info-panel {
  width: 280px;
  padding: 0 0 0 40px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  min-height: 100vh;
  padding: 40px 24px;
}

/* Spec overlay */
.spec-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 300;
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─────────────────────────────────────────────────────────
// SHARED COMPONENTS
// ─────────────────────────────────────────────────────────

function StatusBar({ dark = false }) {
  const c = dark ? 'rgba(0,0,0,0.75)' : 'rgba(255,255,255,0.85)';
  return (
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 24px 0', fontSize:12, fontWeight:700, color:c, position:'absolute', top:0, left:0, right:0, zIndex:100, pointerEvents:'none' }}>
      <span>9:41</span>
      <div style={{ display:'flex', gap:6, alignItems:'center' }}>
        <svg width="17" height="12" viewBox="0 0 17 12" fill={c}><rect x="0" y="5" width="3" height="7" rx="1" opacity="0.4"/><rect x="5" y="3" width="3" height="9" rx="1" opacity="0.6"/><rect x="10" y="0" width="3" height="12" rx="1"/><rect x="14" y="4" width="2" height="5" rx="0.5" opacity="0.35"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill={c}><path d="M8 3C10.2 3 12.2 3.9 13.6 5.4L15 4C13.2 2.1 10.7 1 8 1S2.8 2.1 1 4L2.4 5.4C3.8 3.9 5.8 3 8 3Z" opacity="0.4"/><path d="M8 6C9.4 6 10.6 6.6 11.5 7.5L12.9 6.1C11.6 4.8 9.9 4 8 4S4.4 4.8 3.1 6.1L4.5 7.5C5.4 6.6 6.6 6 8 6Z" opacity="0.7"/><circle cx="8" cy="10" r="1.5"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke={c} strokeOpacity="0.5"/><rect x="23" y="3.5" width="2.5" height="5" rx="1" fill={c} fillOpacity="0.4"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill={c}/></svg>
      </div>
    </div>
  );
}

function HomeIndicator({ dark = false }) {
  return <div style={{ position:'absolute', bottom:8, left:'50%', transform:'translateX(-50%)', width:100, height:5, borderRadius:5, background: dark ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.25)', zIndex:100, pointerEvents:'none' }}/>;
}

const NAV_ITEMS = [
  { id:'home', label:'홈', icon: (active) => (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z" stroke={active?'#ffc400':'rgba(255,255,255,0.35)'} strokeWidth="1.8" strokeLinejoin="round" fill={active?'rgba(255,196,0,0.15)':'none'}/>
      <path d="M9 22V12h6v10" stroke={active?'#ffc400':'rgba(255,255,255,0.35)'} strokeWidth="1.8" strokeLinecap="round"/>
    </svg>
  )},
  { id:'record', label:'기록', icon: (active) => (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="18" height="18" rx="3" stroke={active?'#ffc400':'rgba(255,255,255,0.35)'} strokeWidth="1.8" fill={active?'rgba(255,196,0,0.15)':'none'}/>
      <path d="M7 16l3-4 3 3 3-5" stroke={active?'#ffc400':'rgba(255,255,255,0.35)'} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  )},
  { id:'challenge', label:'챌린지', icon: (active) => (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6L12 2z" stroke={active?'#ffc400':'rgba(255,255,255,0.35)'} strokeWidth="1.8" strokeLinejoin="round" fill={active?'rgba(255,196,0,0.15)':'none'}/>
    </svg>
  )},
  { id:'settings', label:'설정', icon: (active) => (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="3" stroke={active?'#ffc400':'rgba(255,255,255,0.35)'} strokeWidth="1.8"/>
      <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke={active?'#ffc400':'rgba(255,255,255,0.35)'} strokeWidth="1.8" strokeLinecap="round"/>
    </svg>
  )},
];

function BottomNav({ active, onNav }) {
  return (
    <div style={{ display:'flex', justifyContent:'space-around', alignItems:'center', padding:'10px 0 28px', borderTop:'1px solid rgba(255,255,255,0.06)', background:'rgba(10,10,18,0.98)', backdropFilter:'blur(16px)', position:'absolute', bottom:0, left:0, right:0, zIndex:50 }}>
      {NAV_ITEMS.map(item => (
        <button key={item.id} onClick={() => onNav(item.id)} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4, background:'none', border:'none', cursor:'pointer', padding:'4px 12px' }}>
          {item.icon(active === item.id)}
          <span style={{ fontSize:10, fontWeight:600, color: active===item.id ? '#ffc400' : 'rgba(255,255,255,0.3)', letterSpacing:'0.02em' }}>{item.label}</span>
        </button>
      ))}
    </div>
  );
}

function GabpaChar({ stage=1, size=100, glow=false, animated=false }) {
  const palettes = [
    { body:'#f5a623', stripe:'#c47d0e', belly:'#fde9c0', eye:'#3d2b1f', nose:'#c0392b' },
    { body:'#f0961e', stripe:'#b8690a', belly:'#fcddb0', eye:'#2c1f16', nose:'#b03025' },
    { body:'#e8840f', stripe:'#a85c08', belly:'#fbd0a0', eye:'#231810', nose:'#a02820' },
    { body:'#d9720a', stripe:'#984e06', belly:'#f9c490', eye:'#1a1008', nose:'#902018' },
    { body:'#c86008', stripe:'#883e04', belly:'#f7b880', eye:'#120b06', nose:'#801810' },
    { body:'#b84e06', stripe:'#783004', belly:'#f5ac70', eye:'#0c0804', nose:'#700810' },
    { body:'#a83c04', stripe:'#682002', belly:'#f3a060', eye:'#080402', nose:'#600008' },
    { body:'#982a02', stripe:'#581002', belly:'#f19450', eye:'#040200', nose:'#500008' },
    { body:'#881800', stripe:'#480000', belly:'#ef8840', eye:'#020000', nose:'#400000' },
  ];
  const p = palettes[Math.min(stage-1,8)];
  const m = 0.75 + (stage/9)*0.5;
  const headR = 17 + stage*0.35;
  const bodyW = 20*m, armW = 6+stage*0.65, legW = 7+stage*0.55;
  const gc = stage>=7 ? '#ff8800' : p.body;
  return (
    <div style={{ width:size, height:size*1.15, position:'relative', flexShrink:0,
      filter: glow ? `drop-shadow(0 0 ${size*0.12}px ${gc}90) drop-shadow(0 0 ${size*0.28}px ${gc}40)` : 'none',
      animation: animated ? 'charFloat 3s ease-in-out infinite' : 'none' }}>
      <svg width={size} height={size*1.15} viewBox="0 0 100 115" fill="none" style={{ overflow:'visible' }}>
        <ellipse cx="50" cy="112" rx={13*m} ry="3.5" fill="rgba(0,0,0,0.25)"/>
        <path d={`M${50+bodyW-4} 84 Q${50+bodyW+18} 74 ${50+bodyW+13} 60`} stroke={p.body} strokeWidth="6" strokeLinecap="round" fill="none"/>
        <path d={`M${50+bodyW-4} 84 Q${50+bodyW+18} 74 ${50+bodyW+13} 60`} stroke={p.stripe} strokeWidth="2.5" strokeLinecap="round" strokeDasharray="5 4" fill="none"/>
        <ellipse cx={50-legW+2} cy={89} rx={legW*0.7} ry={legW*0.9} fill={p.body}/>
        <ellipse cx={50+legW-2} cy={89} rx={legW*0.7} ry={legW*0.9} fill={p.body}/>
        <ellipse cx={50-legW+1} cy={96} rx={legW*0.85} ry={3.5} fill={p.stripe}/>
        <ellipse cx={50+legW-1} cy={96} rx={legW*0.85} ry={3.5} fill={p.stripe}/>
        {[-3,-1,1].map(dx=><line key={dx} x1={50-legW+1+dx} y1={96} x2={50-legW+1+dx} y2={99} stroke="rgba(0,0,0,0.3)" strokeWidth="1" strokeLinecap="round"/>)}
        {[-3,-1,1].map(dx=><line key={dx+'r'} x1={50+legW-1+dx} y1={96} x2={50+legW-1+dx} y2={99} stroke="rgba(0,0,0,0.3)" strokeWidth="1" strokeLinecap="round"/>)}
        <ellipse cx="50" cy="71" rx={bodyW} ry={bodyW*0.75} fill={p.body}/>
        <ellipse cx="50" cy="73" rx={bodyW*0.55} ry={bodyW*0.6} fill={p.belly}/>
        <path d={`M${50-bodyW*0.8} 64 Q50 61 ${50+bodyW*0.8} 64`} stroke={p.stripe} strokeWidth="2.5" fill="none" strokeLinecap="round"/>
        <path d={`M${50-bodyW*0.7} 71 Q50 68 ${50+bodyW*0.7} 71`} stroke={p.stripe} strokeWidth="2" fill="none" strokeLinecap="round"/>
        {stage>=5&&[0,1].map(i=><path key={i} d={`M${50-bodyW*0.3} ${66+i*6} Q50 ${64+i*6} ${50+bodyW*0.3} ${66+i*6}`} stroke="rgba(0,0,0,0.1)" strokeWidth="1.5" fill="none"/>)}
        <ellipse cx={50-bodyW+2} cy={73} rx={armW*0.6} ry={armW*1.3} fill={p.body} transform={`rotate(-15 ${50-bodyW+2} 73)`}/>
        <ellipse cx={50-bodyW} cy={81} rx={armW*0.8} ry={armW*0.5} fill={p.stripe}/>
        <ellipse cx={50+bodyW-2} cy={73} rx={armW*0.6} ry={armW*1.3} fill={p.body} transform={`rotate(15 ${50+bodyW-2} 73)`}/>
        <ellipse cx={50+bodyW} cy={81} rx={armW*0.8} ry={armW*0.5} fill={p.stripe}/>
        <ellipse cx="50" cy="52" rx={9*m} ry="7" fill={p.body}/>
        <ellipse cx="50" cy="37" rx={headR} ry={headR*0.92} fill={p.body}/>
        <ellipse cx={50-headR*0.5} cy={41} rx={headR*0.35} ry={headR*0.28} fill={p.belly}/>
        <ellipse cx={50+headR*0.5} cy={41} rx={headR*0.35} ry={headR*0.28} fill={p.belly}/>
        <path d="M50 21 L50 29" stroke={p.stripe} strokeWidth="2" strokeLinecap="round"/>
        <path d="M44 23 L42 29" stroke={p.stripe} strokeWidth="1.5" strokeLinecap="round"/>
        <path d="M56 23 L58 29" stroke={p.stripe} strokeWidth="1.5" strokeLinecap="round"/>
        {stage>=6&&<><path d={`M${50-headR*0.55} 30 L${50-headR*0.15} 32`} stroke={p.stripe} strokeWidth="2" strokeLinecap="round"/><path d={`M${50+headR*0.55} 30 L${50+headR*0.15} 32`} stroke={p.stripe} strokeWidth="2" strokeLinecap="round"/></>}
        <ellipse cx={50-headR*0.35} cy={35} rx="3.5" ry="3.8" fill={p.eye}/>
        <ellipse cx={50+headR*0.35} cy={35} rx="3.5" ry="3.8" fill={p.eye}/>
        <ellipse cx={50-headR*0.35+1.2} cy={33.5} rx="1.2" ry="1.2" fill="white"/>
        <ellipse cx={50+headR*0.35+1.2} cy={33.5} rx="1.2" ry="1.2" fill="white"/>
        <ellipse cx="50" cy="40" rx="3.5" ry="2.5" fill={p.nose}/>
        <line x1={50-headR*0.3} y1={42} x2={50-headR*0.9} y2={41} stroke="rgba(255,255,255,0.5)" strokeWidth="0.8"/>
        <line x1={50-headR*0.3} y1={43.5} x2={50-headR*0.9} y2={44} stroke="rgba(255,255,255,0.5)" strokeWidth="0.8"/>
        <line x1={50+headR*0.3} y1={42} x2={50+headR*0.9} y2={41} stroke="rgba(255,255,255,0.5)" strokeWidth="0.8"/>
        <line x1={50+headR*0.3} y1={43.5} x2={50+headR*0.9} y2={44} stroke="rgba(255,255,255,0.5)" strokeWidth="0.8"/>
        <path d={stage>=5?`M47 45 Q50 49 53 45`:`M48 45 Q50 47.5 52 45`} stroke={p.stripe} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
        {stage>=6&&<><polygon points="48.5,45 50,48.5 49.5,45" fill="white" opacity="0.9"/><polygon points="51.5,45 50,48.5 50.5,45" fill="white" opacity="0.9"/></>}
        <polygon points={`${50-headR+2},${37-headR*0.5} ${50-headR*0.6},${37-headR*1.1} ${50-headR*0.3},${37-headR*0.3}`} fill={p.body}/>
        <polygon points={`${50-headR+4},${37-headR*0.45} ${50-headR*0.65},${37-headR*0.95} ${50-headR*0.4},${37-headR*0.3}`} fill={p.nose} opacity="0.7"/>
        <polygon points={`${50+headR-2},${37-headR*0.5} ${50+headR*0.6},${37-headR*1.1} ${50+headR*0.3},${37-headR*0.3}`} fill={p.body}/>
        <polygon points={`${50+headR-4},${37-headR*0.45} ${50+headR*0.65},${37-headR*0.95} ${50+headR*0.4},${37-headR*0.3}`} fill={p.nose} opacity="0.7"/>
        {stage>=7&&<g><polygon points={`50,${37-headR*1.35} 53,${37-headR*1.1} 56,${37-headR*1.4} 58,${37-headR*1.05} 50,${37-headR*0.9} 42,${37-headR*1.05} 44,${37-headR*1.4} 47,${37-headR*1.1}`} fill="#ffc400" opacity="0.95"/><circle cx="50" cy={37-headR*1.35} r="1.5" fill="white" opacity="0.9"/><circle cx="56" cy={37-headR*1.38} r="1" fill="white" opacity="0.8"/><circle cx="44" cy={37-headR*1.38} r="1" fill="white" opacity="0.8"/></g>}
        {stage===9&&<ellipse cx="50" cy="58" rx="42" ry="54" stroke="#ffc400" strokeWidth="1.5" strokeDasharray="5 4" opacity="0.25" fill="none"/>}
      </svg>
    </div>
  );
}

function BtnPrimary({ children, onClick, color='#ffc400', textColor='#000', disabled=false, style={} }) {
  return <button onClick={onClick} disabled={disabled} style={{ width:'100%', padding:'17px 20px', background: disabled?'rgba(255,255,255,0.1)':`linear-gradient(135deg,${color},${color}cc)`, borderRadius:16, fontSize:16, fontWeight:800, color: disabled?'rgba(255,255,255,0.3)':textColor, border:'none', cursor: disabled?'not-allowed':'pointer', letterSpacing:'-0.01em', boxShadow: disabled?'none':`0 4px 20px ${color}40`, transition:'all 0.15s', ...style }}>{children}</button>;
}

function BtnGhost({ children, onClick, style={} }) {
  return <button onClick={onClick} style={{ width:'100%', padding:'15px 20px', background:'transparent', border:'1.5px solid rgba(255,255,255,0.15)', borderRadius:16, fontSize:15, fontWeight:600, color:'rgba(255,255,255,0.55)', cursor:'pointer', ...style }}>{children}</button>;
}

function InputField({ label, placeholder, type='text', value, onChange }) {
  return (
    <div style={{ marginBottom:14 }}>
      <div style={{ fontSize:13, fontWeight:600, color:'rgba(255,255,255,0.5)', marginBottom:6 }}>{label}</div>
      <input type={type} placeholder={placeholder} value={value} onChange={e=>onChange(e.target.value)} style={{ width:'100%', padding:'14px 16px', background:'rgba(255,255,255,0.06)', border:'1.5px solid rgba(255,255,255,0.1)', borderRadius:12, fontSize:15, color:'#fff', fontFamily:'inherit', outline:'none' }}/>
    </div>
  );
}

function ProgressBar({ value, max, color='#ffc400', height=6, extra=0, extraColor='#ff8c00' }) {
  const base = Math.max(0, value - extra);
  const basePct = Math.min(100, (base/max)*100);
  const extraPct = Math.min(100 - basePct, (extra/max)*100);
  return (
    <div style={{ height, background:'rgba(255,255,255,0.08)', borderRadius:height, display:'flex', overflow:'hidden' }}>
      <div style={{ height:'100%', width:`${basePct}%`, background:`linear-gradient(90deg,${color},${color}bb)`, transition:'width 0.5s ease' }}/>
      {extra > 0 && <div style={{ height:'100%', width:`${extraPct}%`, background:`linear-gradient(90deg,${extraColor},#ffe066)`, boxShadow:`0 0 10px ${extraColor}`, transition:'width 0.5s ease' }}/>}
    </div>
  );
}


/* ══════════════════════════════════════
   ONBOARDING SCREENS
══════════════════════════════════════ */
function ScreenSplash({ onNext }) {
  useEffect(() => { const t = setTimeout(onNext, 1800); return () => clearTimeout(t); }, []);
  return (
    <div style={{ width:'100%', height:'100%', background:'radial-gradient(ellipse 100% 80% at 50% 40%, rgba(255,196,0,0.18) 0%, transparent 65%), #0a0a12', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
      <div style={{ animation:'splashPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards', display:'flex', flexDirection:'column', alignItems:'center', gap:16 }}>
        <GabpaChar stage={7} size={100} glow />

function ScreenWorkout({ onFinish, config = { mode:'free', targetCount:[30,25,20], targetSets:3 } }) {
  const isChallenge = config.mode === 'challenge';
  const isTarget = config.mode === 'target';
  const setGoals = Array.isArray(config.targetCount) ? config.targetCount : [30,25,20];

  const [started, setStarted] = useState(false);
  const [count, setCount] = useState(0);
  const [set, setSet] = useState(1);
  const [resting, setResting] = useState(false);
  const [restSec, setRestSec] = useState(60);
  const [pulse, setPulse] = useState(false);
  const [setHistory, setSetHistory] = useState([]);
  const timerRef = useRef(null);
  const restRef = useRef(null);

  const CHALLENGE_GOAL = 100;
  const currentGoal = isTarget ? (setGoals[set-1] ?? 30) : null;
  const remaining = isTarget ? Math.max(0, currentGoal - count) : isChallenge ? Math.max(0, CHALLENGE_GOAL - count) : null;

  useEffect(() => {
    if (!started) return;
    timerRef.current = setInterval(() => {
      setCount(c => {
        const next = c + 1;
        setPulse(true); setTimeout(() => setPulse(false), 150);
        // 목표 모드: 목표 달성 시 자동 세트 완료
        if (isTarget && currentGoal && next >= currentGoal) {
          clearInterval(timerRef.current);
          setTimeout(() => {
            setSetHistory(h => [...h, next]);
            setResting(true);
            setRestSec(60);
          }, 300);
        }
        // 챌린지 모드: 100개 달성 시 자동 완료

function CalendarTab() {
  const [selectedDay, setSelectedDay] = useState(null);
  const [monthOffset, setMonthOffset] = useState(0);

  const MONTH_DATA = {
    0:  { label:'2026년 4월', data:[0,0,15,42,28,0,0,18,95,67,33,0,0,52,103,120,78,25,0,0,30,65,88,45,0,0,22,58,76,0], streak:12 },
    '-1': { label:'2026년 3월', data:[0,0,0,20,35,0,0,45,80,60,0,0,30,70,90,55,0,0,40,85,100,70,0,0,25,60,80,50,20,0,0], streak:8 },
    '-2': { label:'2026년 2월', data:[0,0,30,50,0,0,20,60,85,40,0,0,35,75,95,60,0,0,28,65,90,55,0,0,0,40,70,85,0], streak:5 },
    '-3': { label:'2026년 1월', data:[0,10,25,0,0,15,45,70,50,0,0,20,55,80,60,0,0,30,65,90,70,0,0,25,50,75,55,0,0,20,40], streak:3 },
  };
  const key = String(monthOffset);
  const month = MONTH_DATA[key] || MONTH_DATA['0'];
  const calData = month.data;
  const dayNums = Array.from({length:calData.length},(_,i)=>i+1);

  // 날짜별 세트 더미 데이터 생성
  const getDayDetail = (day, total) => {
    if (!total || total === 0) return null;
    const sets = total > 80 ? 4 : total > 50 ? 3 : total > 20 ? 2 : 1;
    const rows = [];
    let rem = total;
    for (let i = 0; i < sets; i++) {
      const n = i === sets-1 ? rem : Math.floor(rem * (0.35 + Math.random()*0.2));
      rows.push({ s:i+1, n, best: i===0 });
      rem -= n;
    }
    return rows;
  };

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'16px 20px 100px' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, background:'rgba(255,196,0,0.07)', border:'1px solid rgba(255,196,0,0.18)', borderRadius:14, padding:'12px 14px', marginBottom:16 }}>
        <span style={{ fontSize:26 }}>🔥</span>
        <div>
          <div style={{ fontSize:15, fontWeight:900, color:'#ffc400' }}>{month.streak}일 연속 운동 중!</div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,0.4)', marginTop:2 }}>{month.label} 최장 연속 운동일</div>
        </div>
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
        <button onClick={() => { setMonthOffset(o => o-1); setSelectedDay(null); }} style={{ width:32, height:32, borderRadius:'50%', background:'rgba(255,255,255,0.07)', border:'none', cursor:'pointer', fontSize:16, color:'rgba(255,255,255,0.6)', display:'flex', alignItems:'center', justifyContent:'center' }}>←</button>
        <div style={{ fontSize:14, fontWeight:700, color:'rgba(255,255,255,0.7)' }}>{month.label}</div>
        <button onClick={() => { setMonthOffset(o => Math.min(o+1, 0)); setSelectedDay(null); }} style={{ width:32, height:32, borderRadius:'50%', background:'rgba(255,255,255,0.07)', border:'none', cursor: monthOffset >= 0 ? 'not-allowed':'pointer', fontSize:16, color: monthOffset >= 0 ?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.6)', display:'flex', alignItems:'center', justifyContent:'center', opacity: monthOffset >= 0 ? 0.4 : 1 }}>→</button>
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:11, color:'rgba(255,255,255,0.35)', marginBottom:8, padding:'0 2px' }}>
        <span>날짜 · 푸쉬업 횟수</span>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span>적음</span>
          {[0.15,0.3,0.55,0.85].map((a,i)=>(<div key={i} style={{ width:10, height:10, borderRadius:3, background:`rgba(255,196,0,${a})` }}/>))}
          <span>많음</span>
        </div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:4 }}>
        {['일','월','화','수','목','금','토'].map(d=><div key={d} style={{ textAlign:'center', fontSize:10, color:'rgba(255,255,255,0.2)', paddingBottom:2 }}>{d}</div>)}
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:16 }}>
        {calData.map((n,i)=>{
          const lv = n===0?0:n<30?1:n<60?2:n<100?3:4;
          const isToday = monthOffset===0 && i===calData.length-3;
          const isSelected = selectedDay === i;
          const numColor = isSelected ? '#000' : lv>=3 ? 'rgba(0,0,0,0.85)' : '#ffc400';
          return (
            <div key={i} onClick={() => n>0 && setSelectedDay(isSelected ? null : i)} style={{
              height:44, borderRadius:8, position:'relative',
              cursor: n>0 ? 'pointer' : 'default',
              background: isSelected ? '#ffc400' : lv===0 ? 'rgba(255,255,255,0.04)' : `rgba(255,196,0,${[0.15,0.3,0.55,0.85][lv-1]})`,
              outline: isToday ? '2px solid #ffc400' : 'none',
              outlineOffset: 1,
              display:'flex', alignItems:'center', justifyContent:'center',
              transition:'transform 0.1s',
              transform: isSelected ? 'scale(1.08)' : 'scale(1)',
            }}>
              <div style={{ position:'absolute', top:3, left:5, fontSize:9, color: isSelected?'rgba(0,0,0,0.55)':lv>=3?'rgba(0,0,0,0.55)':'rgba(255,255,255,0.35)', fontWeight:600, lineHeight:1 }}>{dayNums[i]}</div>
              {n>0 ? (
                <div style={{ display:'flex', alignItems:'baseline', gap:1, marginTop:6 }}>
                  <span style={{ fontSize:14, fontWeight:900, color:numColor, lineHeight:1, letterSpacing:'-0.02em' }}>{n}</span>
                  <span style={{ fontSize:8, fontWeight:700, color: isSelected?'rgba(0,0,0,0.5)':lv>=3?'rgba(0,0,0,0.5)':'rgba(255,196,0,0.6)', lineHeight:1 }}>회</span>
                </div>
              ) : (
                <div style={{ width:3, height:3, borderRadius:'50%', background:'rgba(255,255,255,0.1)' }}/>
              )}
            </div>
          );
        })}
      </div>

      {/* 선택된 날짜 상세 */}
      {selectedDay !== null && calData[selectedDay] > 0 ? (
        <div style={{ background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,196,0,0.2)', borderRadius:16, padding:16, animation:'fadeIn 0.2s ease' }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
            <div style={{ fontSize:14, fontWeight:800, color:'#fff' }}>
              {month.label.replace('년 ','년 ').split('년 ')[0]}년 {month.label.split('년 ')[1]} {dayNums[selectedDay]}일
            </div>
            <div style={{ fontSize:14, fontWeight:900, color:'#ffc400' }}>총 {calData[selectedDay]}개</div>
          </div>
          {getDayDetail(dayNums[selectedDay], calData[selectedDay])?.map(row=>(
            <div key={row.s} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'9px 0', borderBottom:'1px solid rgba(255,255,255,0.05)' }}>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <div style={{ width:24, height:24, borderRadius:8, background: row.best?'rgba(255,196,0,0.15)':'rgba(255,255,255,0.06)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:800, color: row.best?'#ffc400':'rgba(255,255,255,0.4)' }}>{row.s}</div>
                <span style={{ fontSize:13, color:'#fff', fontWeight:600 }}>세트 {row.s}</span>
                {row.best && <span style={{ fontSize:9, background:'rgba(255,196,0,0.15)', color:'#ffc400', padding:'2px 6px', borderRadius:4, fontWeight:800 }}>최고</span>}
              </div>
              <span style={{ fontSize:14, fontWeight:900, color: row.best?'#ffc400':'rgba(255,255,255,0.7)' }}>{row.n}개</span>
            </div>
          ))}
        </div>
      ) : selectedDay !== null && calData[selectedDay] === 0 ? (
        <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:16, padding:16, textAlign:'center' }}>
          <div style={{ fontSize:24, marginBottom:8 }}>😴</div>
          <div style={{ fontSize:13, color:'rgba(255,255,255,0.4)' }}>이 날은 쉬었어요</div>
        </div>
      ) : (
        <div style={{ textAlign:'center', padding:'12px 0', fontSize:12, color:'rgba(255,255,255,0.2)' }}>
          날짜를 눌러 상세 기록을 확인하세요
        </div>
      )}
    </div>
  );
}

            <button onClick={() => setVal(v => Math.max(0, v-1))} style={{ width:28, height:28, borderRadius:8, background:'rgba(255,255,255,0.1)', border:'none', color:'#fff', fontSize:16, cursor:'pointer', fontWeight:700 }}>−</button>

            <button onClick={() => setEditing(false)} style={{ padding:'4px 10px', borderRadius:8, background:'#ffc400', border:'none', color:'#000', fontSize:11, fontWeight:800, cursor:'pointer' }}>확인</button>

            <span style={{ fontSize:10, color:'rgba(255,255,255,0.3)' }}>✏️</span>
          </button>
        )}
      </div>
    </div>
  );
}

function ScreenCharacter({ onNav, onBack, charStage=3, totalPushups=847 }) {
  const stageBoundaries = [0, 100, 500, 2000, 5000, 10000, 25000, 50000, 100000];
  const stageData = [
    {lv:1,label:'마른 체형'},{lv:2,label:'약간 다듬어진'},
    {lv:3,label:'보통 운동인'},{lv:4,label:'단단한 체형'},
    {lv:5,label:'근육질'},{lv:6,label:'대흉근 부각'},
    {lv:7,label:'갑빠 형태 완성'},{lv:8,label:'보디빌더형'},{lv:9,label:'갑빠왕'},
  ].map(s => {
    const lo = stageBoundaries[s.lv-1];
    const hi = s.lv < 9 ? stageBoundaries[s.lv] - 1 : null;
    const range = hi === null ? `${lo.toLocaleString()}+` : `${lo.toLocaleString()}–${hi.toLocaleString()}`;
    return {
      ...s,
      range,
      done: s.lv < charStage,
      current: s.lv === charStage,
    };
  });
  const curStageLabel = stageData[charStage-1]?.label ?? '';
  const curThreshold = stageBoundaries[charStage-1] ?? 0;
  const nextThreshold = stageBoundaries[charStage] ?? stageBoundaries[stageBoundaries.length-1];
  const remainingToNext = Math.max(0, nextThreshold - totalPushups);
  return (
    <div style={{ width:'100%', height:'100%', background:'#0a0a12', display:'flex', flexDirection:'column' }}>
      <StatusBar />
      <div style={{ padding:'52px 20px 0', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <button onClick={onBack} style={{ width:36, height:36, borderRadius:'50%', background:'rgba(255,255,255,0.07)', border:'none', cursor:'pointer', fontSize:18, color:'rgba(255,255,255,0.7)', display:'flex', alignItems:'center', justifyContent:'center' }}>←</button>
          <div style={{ fontSize:22, fontWeight:900, color:'#fff', letterSpacing:'-0.03em' }}>나의 갑빠</div>
        </div>
        <div style={{ fontSize:12, color:'rgba(255,255,255,0.3)', fontWeight:600 }}>누적 {totalPushups.toLocaleString()}개</div>
      </div>
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'16px 20px 12px', background:'radial-gradient(ellipse 70% 50% at 50% 50%, rgba(255,196,0,0.07) 0%, transparent 70%)' }}>
        <GabpaChar stage={charStage} size={100} glow />
        <div style={{ fontSize:17, fontWeight:800, color:'#fff', marginTop:12 }}>갑빠지망생</div>

/* ══════════════════════════════════════
   TRANSITION MANAGER
══════════════════════════════════════ */
function TransitionScreen({ children, screenKey, direction }) {
  const [visible, setVisible] = useState(children);
  const [animClass, setAnimClass] = useState('');
  const prevRef = useRef(screenKey);

  useEffect(() => {
    if (screenKey === prevRef.current) return;
    setAnimClass('screen-enter');
    const t = setTimeout(() => {
      setVisible(children);
      setAnimClass('');
      prevRef.current = screenKey;
    }, 260);
    return () => clearTimeout(t);
  }, [screenKey]);

  return (
    <div style={{ width: '100%', height: '100%', position: 'relative' }}>
      <div className={animClass} style={{ width: '100%', height: '100%' }}>
        {visible}
      </div>
    </div>
  );
}

  return (notes[screen] || '').split('\n').map((line, i) => (
    <div key={i} style={{ marginBottom: 2 }}>• {line}</div>
  ));
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
